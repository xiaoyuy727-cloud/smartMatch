<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学生管理 - 师生匹配系统</title>
  <script src="./common.js"></script>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="section-title">
      <h1>学生管理</h1>
      <div class="row">
        <a class="btn" href="./volunteers.html">志愿者管理</a>
        <a class="btn" href="./matching.html">匹配与结果</a>
      </div>
    </div>
    <div class="row">
      <div class="col grow">
        <label>后端 API Base</label>
        <input id="apiBase" type="text" placeholder="http://127.0.0.1:8000" />
      </div>
      <div class="col">
        <label>&nbsp;</label>
        <button id="saveApiBaseBtn" class="btn">保存</button>
      </div>
    </div>
    <div id="topMsg"></div>
  </div>

  <div class="card">
    <h2>导入学生 Excel（xlsx，无表头，固定16列）</h2>
    <div class="row">
      <input id="fileInput" type="file" accept=".xlsx" />
      <button id="previewBtn" class="btn primary">预览导入</button>
      <button id="commitBtn" class="btn ok" disabled>确认提交</button>
      <span class="muted">规则：文件内重复序号保留第一条；数据库已存在序号跳过</span>
    </div>
    <div id="importMsg"></div>

    <div class="grid-2" style="margin-top:12px;">
      <div class="card" style="margin:0;">
        <h3>预览统计</h3>
        <div id="previewStats" class="stats"></div>
      </div>
      <div class="card" style="margin:0;">
        <h3>错误汇总（Top）</h3>
        <div id="errorSummary"></div>
      </div>
    </div>

    <div style="margin-top:12px;">
      <h3>预览行（前50行）</h3>
      <div id="previewTable"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">
      <h2>学生列表</h2>
      <div class="row">
        <button id="reloadBtn" class="btn">刷新</button>
      </div>
    </div>

    <div class="row" style="margin-bottom:8px;">
      <div class="col">
        <label>关键词（序号/姓名）</label>
        <input id="qInput" type="text" placeholder="如：1001 / 张三" />
      </div>
      <div class="col">
        <label>学段</label>
        <select id="stageFilter">
          <option value="">全部</option>
          <option value="1">1 小学</option>
          <option value="2">2 初中</option>
          <option value="3">3 高中</option>
        </select>
      </div>
      <div class="col">
        <label>辅导方式</label>
        <select id="modeFilter">
          <option value="">全部</option>
          <option value="offline">offline</option>
          <option value="online">online</option>
          <option value="both">both</option>
        </select>
      </div>
      <div class="col">
        <label>是否优先</label>
        <select id="priorityFilter">
          <option value="">全部</option>
          <option value="1">1</option>
          <option value="0">0</option>
        </select>
      </div>
      <div class="col">
        <label>每页</label>
        <select id="limitSelect">
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
      <div class="col">
        <label>&nbsp;</label>
        <button id="searchBtn" class="btn primary">查询</button>
      </div>
    </div>

    <div id="listMsg"></div>
    <div id="studentsTable"></div>
    <div id="studentsPager"></div>
  </div>
</div>

<script>
  let previewJobId = null;
  let listState = { offset: 0, limit: 20, total: 0 };

  function initApiBaseUI() {
    $("#apiBase").value = APP.getApiBase();
    $("#saveApiBaseBtn").onclick = () => {
      APP.setApiBase($("#apiBase").value);
      showMsg($("#topMsg"), "API Base 已保存：" + APP.getApiBase(), "success");
    };
  }

  function renderStats(stats) {
    const box = $("#previewStats");
    if (!stats) {
      box.innerHTML = `<div class="empty">暂无预览统计</div>`;
      return;
    }
    const items = [
      ["总行数", stats.total_rows],
      ["有效行", stats.valid_rows],
      ["错误行", stats.error_rows],
      ["文件内重复", stats.duplicate_rows_in_file],
    ];
    box.innerHTML = items.map(([k,v]) => `
      <div class="stat"><div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div></div>
    `).join("");
  }

  function renderErrorSummary(arr) {
    const box = $("#errorSummary");
    if (!arr || arr.length === 0) {
      box.innerHTML = `<div class="empty">无错误</div>`;
      return;
    }
    renderTable(box, [
      { key: "error", label: "错误" },
      { key: "count", label: "次数" },
    ], arr, { emptyText: "无错误" });
  }

  function renderPreviewRows(rows) {
    const box = $("#previewTable");
    const columns = [
      { key: "row_no", label: "行号" },
      { key: "errors", label: "错误", render: r => (r.errors || []).join(" | ") },
      {
        key: "data",
        label: "解析结果",
        render: r => r.data ? JSON.stringify(r.data, null, 2) : "",
      },
    ];
    renderTable(box, columns, rows || [], { emptyText: "暂无预览数据" });
  }

  async function doPreview() {
    const file = $("#fileInput").files[0];
    if (!file) {
      showMsg($("#importMsg"), "请先选择xlsx文件", "warn");
      return;
    }
    previewJobId = null;
    $("#commitBtn").disabled = true;
    showMsg($("#importMsg"), "正在预览...", "info");
    try {
      const data = await apiUpload("/api/students/import/preview", file);
      previewJobId = data.job_id;
      renderStats(data.stats);
      renderErrorSummary(data.error_summary);
      renderPreviewRows(data.preview || data.rows || []);
      $("#commitBtn").disabled = false;
      showMsg($("#importMsg"), `预览完成，job_id=${previewJobId}`, "success");
    } catch (e) {
      showMsg($("#importMsg"), "预览失败：" + e.message, "error");
    }
  }

  async function doCommit() {
    if (!previewJobId) {
      showMsg($("#importMsg"), "请先预览导入", "warn");
      return;
    }
    $("#commitBtn").disabled = true;
    showMsg($("#importMsg"), "正在提交导入...", "info");
    try {
      const data = await apiPost(`/api/students/import/${encodeURIComponent(previewJobId)}/commit`);
      showMsg($("#importMsg"), data.message || "导入完成", "success");
      previewJobId = null;
      await loadStudents(true);
    } catch (e) {
      showMsg($("#importMsg"), "提交失败：" + e.message, "error");
      $("#commitBtn").disabled = false;
    }
  }

  function getListQuery() {
    const q = $("#qInput").value.trim();
    const stage = $("#stageFilter").value;
    const mode = $("#modeFilter").value;
    const isPriority = $("#priorityFilter").value;
    const limit = Number($("#limitSelect").value || 20);
    return { q, stage, mode, isPriority, limit };
  }

  async function loadStudents(resetOffset = false) {
    if (resetOffset) listState.offset = 0;
    const qv = getListQuery();
    listState.limit = qv.limit;

    const params = new URLSearchParams();
    params.set("offset", String(listState.offset));
    params.set("limit", String(listState.limit));
    if (qv.q) params.set("q", qv.q);
    if (qv.stage) params.set("stage_code", qv.stage);
    if (qv.mode) params.set("tutoring_mode", qv.mode);
    if (qv.isPriority !== "") params.set("is_priority", qv.isPriority);

    showMsg($("#listMsg"), "正在加载学生列表...", "info");
    try {
      const data = await apiGet(`/api/students?${params.toString()}`);
      listState.total = data.total || 0;
      renderStudentsTable(data.items || []);
      renderPager($("#studentsPager"), listState, (next) => {
        listState.offset = next.offset;
        listState.limit = next.limit;
        loadStudents(false);
      });
      showMsg($("#listMsg"), `加载完成：共 ${listState.total} 条`, "success");
    } catch (e) {
      showMsg($("#listMsg"), "加载失败：" + e.message, "error");
    }
  }

  function renderStudentsTable(rows) {
    const columns = [
      { key: "seq_no", label: "序号" },
      { key: "name", label: "姓名" },
      { key: "gender", label: "性别" },
      { key: "stage_code", label: "学段" },
      { key: "tutoring_mode", label: "线上/线下" },
      { key: "subj1", label: "科目1" },
      { key: "subj2", label: "科目2" },
      { key: "subj3", label: "科目3" },
      { key: "is_priority", label: "优先", render: r => fmtBool01(r.is_priority) },
      { key: "special_need", label: "特殊需求" },
      { key: "learning_style", label: "学习风格" },
      { key: "personality", label: "学生性格" },
    ];

    renderTable($("#studentsTable"), columns, rows, {
      emptyText: "暂无学生数据",
      rowActions: (r) => `
        <button class="btn danger" data-action="delete" data-seq="${escapeHtml(r.seq_no)}">删除</button>
      `,
    });

    $("#studentsTable").onclick = async (e) => {
      const btn = e.target.closest("button[data-action='delete']");
      if (!btn) return;
      const seq = btn.dataset.seq;
      if (!confirm(`确认删除学生序号 ${seq} ?`)) return;
      try {
        await apiDelete(`/api/students/${encodeURIComponent(seq)}`);
        showMsg($("#listMsg"), `已删除学生 ${seq}`, "success");
        await loadStudents(false);
      } catch (err) {
        showMsg($("#listMsg"), "删除失败：" + err.message, "error");
      }
    };
  }

  function bindEvents() {
    $("#previewBtn").onclick = doPreview;
    $("#commitBtn").onclick = doCommit;
    $("#reloadBtn").onclick = () => loadStudents(false);
    $("#searchBtn").onclick = () => loadStudents(true);
    $("#qInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadStudents(true);
    });
  }

  (function main() {
    initApiBaseUI();
    bindEvents();
    renderStats(null);
    renderErrorSummary([]);
    renderPreviewRows([]);
    loadStudents(true);
  })();
</script>
</body>
</html>
