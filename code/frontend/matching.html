<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>匹配与结果 - 师生匹配系统</title>
  <script src="./common.js"></script>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="section-title">
      <h1>匹配与结果</h1>
      <div class="row">
        <a class="btn" href="./students.html">学生管理</a>
        <a class="btn" href="./volunteers.html">志愿者管理</a>
      </div>
    </div>

    <div class="row">
      <div class="col grow">
        <label>后端 API Base</label>
        <input id="apiBase" type="text" placeholder="http://127.0.0.1:8000" />
      </div>
      <div class="col">
        <label>&nbsp;</label>
        <button id="saveApiBaseBtn" class="btn">保存</button>
      </div>
    </div>

    <div class="row" style="margin-top:10px;">
      <button id="runBtn" class="btn primary">运行完整匹配（clear旧结果）</button>
      <button id="refreshAllBtn" class="btn">刷新当前结果</button>
      <button id="exportBtn" class="btn ok">导出Excel（4 sheets）</button>
      <label class="row" style="gap:6px;">
        <input id="autoRefreshAfterRun" type="checkbox" checked />
        <span>运行后自动刷新结果</span>
      </label>
    </div>
    <div id="topMsg"></div>
  </div>

  <div class="card">
    <h2>匹配运行摘要</h2>
    <div id="summaryStats" class="stats"></div>
    <div id="summaryRaw" class="muted" style="margin-top:8px;"></div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="btn tab-btn active" data-tab="final">最终匹配结果</button>
      <button class="btn tab-btn" data-tab="unmatched">未匹配学生</button>
      <button class="btn tab-btn" data-tab="unused">未使用老师</button>
      <button class="btn tab-btn" data-tab="pairs">合法Pair打分明细</button>
    </div>
  </div>

  <!-- 最终匹配结果 -->
  <div class="card tab-panel" id="panel-final">
    <div class="section-title">
      <h2>最终匹配结果</h2>
      <div class="row">
        <button id="loadFinalBtn" class="btn">刷新本页</button>
      </div>
    </div>
    <div class="row" style="margin-bottom:8px;">
      <div class="col">
        <label>每页</label>
        <select id="finalLimit">
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="200">200</option>
        </select>
      </div>
    </div>
    <div id="finalMsg"></div>
    <div id="finalTable"></div>
    <div id="finalPager"></div>
  </div>

  <!-- 未匹配学生 -->
  <div class="card tab-panel hidden" id="panel-unmatched">
    <div class="section-title">
      <h2>未匹配学生</h2>
      <button id="loadUnmatchedBtn" class="btn">刷新本页</button>
    </div>
    <div class="row" style="margin-bottom:8px;">
      <div class="col">
        <label>每页</label>
        <select id="unmatchedLimit">
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
      </div>
    </div>
    <div id="unmatchedMsg"></div>
    <div id="unmatchedTable"></div>
    <div id="unmatchedPager"></div>
  </div>

  <!-- 未使用老师 -->
  <div class="card tab-panel hidden" id="panel-unused">
    <div class="section-title">
      <h2>未使用老师</h2>
      <button id="loadUnusedBtn" class="btn">刷新本页</button>
    </div>
    <div class="row" style="margin-bottom:8px;">
      <div class="col">
        <label>每页</label>
        <select id="unusedLimit">
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
      </div>
    </div>
    <div id="unusedMsg"></div>
    <div id="unusedTable"></div>
    <div id="unusedPager"></div>
  </div>

  <!-- 合法pair打分明细 -->
  <div class="card tab-panel hidden" id="panel-pairs">
    <div class="section-title">
      <h2>合法 Pair 打分明细</h2>
      <button id="loadPairsBtn" class="btn">刷新本页</button>
    </div>

    <div class="row" style="margin-bottom:8px;">
      <div class="col">
        <label>阶段</label>
        <select id="pairsPhase">
          <option value="">全部</option>
          <option value="direct">direct</option>
          <option value="pre">pre</option>
        </select>
      </div>
      <div class="col">
        <label>是否入选最终结果</label>
        <select id="pairsSelected">
          <option value="">全部</option>
          <option value="true">true</option>
          <option value="false">false</option>
        </select>
      </div>
      <div class="col">
        <label>学生序号</label>
        <input id="pairsStudentSeq" type="text" placeholder="精确匹配" />
      </div>
      <div class="col">
        <label>老师序号</label>
        <input id="pairsTeacherSeq" type="text" placeholder="精确匹配" />
      </div>
      <div class="col">
        <label>每页</label>
        <select id="pairsLimit">
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="200">200</option>
          <option value="500">500</option>
        </select>
      </div>
      <div class="col">
        <label>&nbsp;</label>
        <button id="pairsSearchBtn" class="btn primary">查询</button>
      </div>
      <div class="col">
        <label>&nbsp;</label>
        <label class="row" style="gap:6px;">
          <input id="pairsIncludeRaw" type="checkbox" />
          <span>显示DS原文/错误信息</span>
        </label>
      </div>
    </div>

    <div id="pairsMsg"></div>
    <div id="pairsTable"></div>
    <div id="pairsPager"></div>
  </div>
</div>

<script>
  const state = {
    final: { offset: 0, limit: 100, total: 0 },
    unmatched: { offset: 0, limit: 50, total: 0 },
    unused: { offset: 0, limit: 50, total: 0 },
    pairs: { offset: 0, limit: 100, total: 0 },
    summary: null,
  };

  // ============ API Base ============
  function initApiBaseUI() {
    $("#apiBase").value = APP.getApiBase();
    $("#saveApiBaseBtn").onclick = () => {
      APP.setApiBase($("#apiBase").value);
      showMsg($("#topMsg"), "API Base 已保存：" + APP.getApiBase(), "success");
    };
  }

  // ============ Tabs ============
  function switchTab(tabName) {
    $all(".tab-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === tabName));
    $("#panel-final").classList.toggle("hidden", tabName !== "final");
    $("#panel-unmatched").classList.toggle("hidden", tabName !== "unmatched");
    $("#panel-unused").classList.toggle("hidden", tabName !== "unused");
    $("#panel-pairs").classList.toggle("hidden", tabName !== "pairs");
  }

  function bindTabs() {
    $all(".tab-btn").forEach(btn => {
      btn.onclick = () => switchTab(btn.dataset.tab);
    });
  }

  // ============ Summary ============
  function renderSummary(summary) {
    const box = $("#summaryStats");
    const raw = $("#summaryRaw");
    if (!summary) {
      box.innerHTML = `<div class="empty">尚未运行匹配，或暂无摘要</div>`;
      raw.textContent = "";
      return;
    }
    const items = [
      ["总学生数", summary.total_students],
      ["总老师数", summary.total_volunteers],
      ["direct老师数", summary.direct_volunteers],
      ["pre老师数", summary.pre_volunteers],
      ["direct匹配数", summary.direct_matched],
      ["pre匹配数", summary.pre_matched],
      ["总匹配数", summary.total_matched],
      ["未匹配学生", summary.unmatched_students],
      ["未使用老师", summary.unused_volunteers],
    ];
    box.innerHTML = items.map(([k,v]) => `
      <div class="stat">
        <div class="k">${escapeHtml(k)}</div>
        <div class="v">${escapeHtml(v)}</div>
      </div>
    `).join("");
    raw.textContent = summary.message || "";
  }

  async function runFullMatch() {
    if (!confirm("确认运行完整匹配？这会清空旧结果（不会清空学生/老师数据，也不会清空DS缓存）。")) return;
    $("#runBtn").disabled = true;
    showMsg($("#topMsg"), "正在运行完整匹配（可能较慢，尤其首次调用DS时）...", "info");
    try {
      const data = await apiPost("/api/matching/run-full");
      state.summary = data;
      renderSummary(data);
      showMsg($("#topMsg"), data.message || "匹配完成", "success");
      if ($("#autoRefreshAfterRun").checked) {
        await refreshAllPanels();
      }
    } catch (e) {
      showMsg($("#topMsg"), "运行匹配失败：" + e.message, "error");
    } finally {
      $("#runBtn").disabled = false;
    }
  }

  async function doExport() {
    $("#exportBtn").disabled = true;
    showMsg($("#topMsg"), "正在导出Excel...", "info");
    try {
      await apiDownload("/api/matching/export", "matching_export.xlsx");
      showMsg($("#topMsg"), "导出完成", "success");
    } catch (e) {
      showMsg($("#topMsg"), "导出失败：" + e.message, "error");
    } finally {
      $("#exportBtn").disabled = false;
    }
  }

  // ============ Final Results ============
  async function loadFinal(resetOffset = false) {
    if (resetOffset) state.final.offset = 0;
    state.final.limit = Number($("#finalLimit").value || 100);

    const params = new URLSearchParams({
      offset: String(state.final.offset),
      limit: String(state.final.limit),
    });

    showMsg($("#finalMsg"), "正在加载最终匹配结果...", "info");
    try {
      const data = await apiGet(`/api/matching/results?${params.toString()}`);
      state.final.total = data.total || 0;
      renderFinalTable(data.items || []);
      renderPager($("#finalPager"), state.final, (next) => {
        state.final.offset = next.offset;
        state.final.limit = next.limit;
        loadFinal(false);
      });
      showMsg($("#finalMsg"), `加载完成：共 ${state.final.total} 条`, "success");
    } catch (e) {
      showMsg($("#finalMsg"), "加载失败：" + e.message, "error");
    }
  }

  function renderFinalTable(rows) {
    const cols = [
      { key: "phase", label: "阶段" },
      { key: "student_seq", label: "学生序号" },
      { key: "student_name", label: "学生姓名" },
      { key: "teacher_seq", label: "老师序号" },
      { key: "teacher_name", label: "老师姓名" },
      { key: "tutoring_mode", label: "辅导方式" },
      { key: "teacher_match_mode", label: "老师匹配模式" },
      { key: "total_score", label: "总分", render: r => fmtNum(r.total_score) },
      { key: "grade_score", label: "年级分", render: r => fmtNum(r.grade_score) },
      { key: "subject_score", label: "科目分", render: r => fmtNum(r.subject_score) },
      { key: "ds_subjective_score", label: "主观分(DS)", render: r => fmtNum(r.ds_subjective_score) },
      { key: "ds_special_penalty", label: "特殊惩罚(DS)", render: r => fmtNum(r.ds_special_penalty) },
      { key: "ds_subjective_reason_summary", label: "DS主观理由摘要" },
      { key: "ds_special_reason_summary", label: "DS特殊需求惩罚理由摘要" },
    ];
    renderTable($("#finalTable"), cols, rows, { emptyText: "暂无最终匹配结果" });
  }

  // ============ Unmatched Students ============
  async function loadUnmatched(resetOffset = false) {
    if (resetOffset) state.unmatched.offset = 0;
    state.unmatched.limit = Number($("#unmatchedLimit").value || 50);

    const params = new URLSearchParams({
      offset: String(state.unmatched.offset),
      limit: String(state.unmatched.limit),
    });

    showMsg($("#unmatchedMsg"), "正在加载未匹配学生...", "info");
    try {
      const data = await apiGet(`/api/matching/unmatched-students?${params.toString()}`);
      state.unmatched.total = data.total || 0;
      renderUnmatchedTable(data.items || []);
      renderPager($("#unmatchedPager"), state.unmatched, (next) => {
        state.unmatched.offset = next.offset;
        state.unmatched.limit = next.limit;
        loadUnmatched(false);
      });
      showMsg($("#unmatchedMsg"), `加载完成：共 ${state.unmatched.total} 条`, "success");
    } catch (e) {
      showMsg($("#unmatchedMsg"), "加载失败：" + e.message, "error");
    }
  }

  function renderUnmatchedTable(rows) {
    const cols = [
      { key: "student_seq", label: "学生序号" },
      { key: "student_name", label: "学生姓名" },
      { key: "gender", label: "性别" },
      { key: "stage_code", label: "学段" },
      { key: "tutoring_mode", label: "辅导方式" },
      { key: "is_priority", label: "优先", render: r => fmtBool01(r.is_priority) },
      { key: "reason_summary", label: "原因摘要" },
    ];
    renderTable($("#unmatchedTable"), cols, rows, { emptyText: "暂无未匹配学生" });
  }

  // ============ Unused Volunteers ============
  async function loadUnused(resetOffset = false) {
    if (resetOffset) state.unused.offset = 0;
    state.unused.limit = Number($("#unusedLimit").value || 50);

    const params = new URLSearchParams({
      offset: String(state.unused.offset),
      limit: String(state.unused.limit),
    });

    showMsg($("#unusedMsg"), "正在加载未使用老师...", "info");
    try {
      const data = await apiGet(`/api/matching/unused-volunteers?${params.toString()}`);
      state.unused.total = data.total || 0;
      renderUnusedTable(data.items || []);
      renderPager($("#unusedPager"), state.unused, (next) => {
        state.unused.offset = next.offset;
        state.unused.limit = next.limit;
        loadUnused(false);
      });
      showMsg($("#unusedMsg"), `加载完成：共 ${state.unused.total} 条`, "success");
    } catch (e) {
      showMsg($("#unusedMsg"), "加载失败：" + e.message, "error");
    }
  }

  function renderUnusedTable(rows) {
    const cols = [
      { key: "teacher_seq", label: "老师序号" },
      { key: "teacher_name", label: "老师姓名" },
      { key: "gender", label: "性别" },
      { key: "tutoring_mode", label: "辅导方式" },
      { key: "match_mode", label: "匹配模式" },
      { key: "reason_summary", label: "原因摘要" },
    ];
    renderTable($("#unusedTable"), cols, rows, { emptyText: "暂无未使用老师" });
  }

  // ============ Pair Details ============
  function getPairsQuery() {
    return {
      phase: $("#pairsPhase").value,
      selected: $("#pairsSelected").value,
      studentSeq: $("#pairsStudentSeq").value.trim(),
      teacherSeq: $("#pairsTeacherSeq").value.trim(),
      includeRaw: $("#pairsIncludeRaw").checked ? 1 : 0,
      limit: Number($("#pairsLimit").value || 100),
    };
  }

  async function loadPairs(resetOffset = false) {
    if (resetOffset) state.pairs.offset = 0;
    const q = getPairsQuery();
    state.pairs.limit = q.limit;

    const params = new URLSearchParams();
    params.set("offset", String(state.pairs.offset));
    params.set("limit", String(state.pairs.limit));
    if (q.phase) params.set("phase", q.phase);
    if (q.selected) params.set("selected_in_final", q.selected);
    if (q.studentSeq) params.set("student_seq", q.studentSeq);
    if (q.teacherSeq) params.set("teacher_seq", q.teacherSeq);
    params.set("include_raw", String(q.includeRaw));

    showMsg($("#pairsMsg"), "正在加载合法Pair打分明细...", "info");
    try {
      const data = await apiGet(`/api/matching/pairs?${params.toString()}`);
      state.pairs.total = data.total || 0;
      renderPairsTable(data.items || [], q.includeRaw === 1);
      renderPager($("#pairsPager"), state.pairs, (next) => {
        state.pairs.offset = next.offset;
        state.pairs.limit = next.limit;
        loadPairs(false);
      });
      showMsg($("#pairsMsg"), `加载完成：共 ${state.pairs.total} 条`, "success");
    } catch (e) {
      showMsg($("#pairsMsg"), "加载失败：" + e.message, "error");
    }
  }

  function renderPairsTable(rows, includeRaw) {
    const cols = [
      { key: "phase", label: "阶段" },
      { key: "selected_in_final", label: "入选", render: r => fmtBool01(r.selected_in_final) },

      { key: "student_seq", label: "学生序号" },
      { key: "student_name", label: "学生姓名" },
      { key: "student_is_priority", label: "学生优先", render: r => fmtBool01(r.student_is_priority) },
      { key: "student_tutoring_mode", label: "学生方式" },

      { key: "teacher_seq", label: "老师序号" },
      { key: "teacher_name", label: "老师姓名" },
      { key: "teacher_match_mode", label: "老师匹配模式" },
      { key: "teacher_tutoring_mode", label: "老师方式" },

      { key: "total_score", label: "总分", render: r => fmtNum(r.total_score) },
      { key: "grade_score", label: "年级分", render: r => fmtNum(r.grade_score) },
      { key: "subject_score", label: "科目分", render: r => fmtNum(r.subject_score) },
      { key: "best_subject_raw", label: "科目原始最佳分", render: r => fmtNum(r.best_subject_raw) },

      { key: "ds_subjective_score", label: "主观分(DS)", render: r => fmtNum(r.ds_subjective_score) },
      { key: "ds_subjective_status", label: "主观状态" },
      { key: "ds_subjective_cache_hit", label: "主观缓存命中", render: r => fmtBool01(r.ds_subjective_cache_hit) },
      { key: "ds_subjective_reason_summary", label: "主观理由摘要" },

      { key: "ds_special_penalty", label: "特殊惩罚(DS)", render: r => fmtNum(r.ds_special_penalty) },
      { key: "ds_special_status", label: "特殊状态" },
      { key: "ds_special_cache_hit", label: "特殊缓存命中", render: r => fmtBool01(r.ds_special_cache_hit) },
      { key: "ds_special_reason_summary", label: "特殊理由摘要" },
    ];

    if (includeRaw) {
      cols.push(
        { key: "ds_subjective_error_message", label: "主观错误信息" },
        { key: "ds_special_error_message", label: "特殊错误信息" },
        { key: "ds_subjective_reason_raw", label: "主观DS原文" },
        { key: "ds_special_reason_raw", label: "特殊DS原文" },
      );
    }

    renderTable($("#pairsTable"), cols, rows, { emptyText: "暂无合法Pair打分明细" });
  }

  // ============ 批量刷新 ============
  async function refreshAllPanels() {
    await Promise.allSettled([
      loadFinal(true),
      loadUnmatched(true),
      loadUnused(true),
      loadPairs(true),
    ]);
  }

  // ============ 绑定事件 ============
  function bindEvents() {
    $("#runBtn").onclick = runFullMatch;
    $("#refreshAllBtn").onclick = refreshAllPanels;
    $("#exportBtn").onclick = doExport;

    $("#loadFinalBtn").onclick = () => loadFinal(false);
    $("#loadUnmatchedBtn").onclick = () => loadUnmatched(false);
    $("#loadUnusedBtn").onclick = () => loadUnused(false);
    $("#loadPairsBtn").onclick = () => loadPairs(false);

    $("#finalLimit").onchange = () => loadFinal(true);
    $("#unmatchedLimit").onchange = () => loadUnmatched(true);
    $("#unusedLimit").onchange = () => loadUnused(true);

    $("#pairsSearchBtn").onclick = () => loadPairs(true);
    $("#pairsLimit").onchange = () => loadPairs(true);
    $("#pairsPhase").onchange = () => loadPairs(true);
    $("#pairsSelected").onchange = () => loadPairs(true);
    $("#pairsIncludeRaw").onchange = () => loadPairs(true);

    $("#pairsStudentSeq").addEventListener("keydown", e => { if (e.key === "Enter") loadPairs(true); });
    $("#pairsTeacherSeq").addEventListener("keydown", e => { if (e.key === "Enter") loadPairs(true); });
  }

  (function main() {
    initApiBaseUI();
    bindTabs();
    bindEvents();
    renderSummary(null);
    loadFinal(true);
    loadUnmatched(true);
    loadUnused(true);
    loadPairs(true);
  })();
</script>
</body>
</html>
